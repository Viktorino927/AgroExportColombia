{% extends 'base.html' %}

{% block title %}Iniciar Sesión - AgroExport{% endblock %}

{% block extra_css %}
<style>
    body {
        background: #f5f7f5;
    }

    .login-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 5rem;
        padding-bottom: 3rem;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 2.8rem;
        border-radius: 18px;
        box-shadow: 0px 6px 18px rgba(0,0,0,0.12);
        animation: fadeIn 0.6s ease-in-out;
    }

    .login-title {
        text-align: center;
        margin-bottom: 1rem;
    }

    .login-title h2 {
        font-size: 2rem;
        color: #2e7d32;
        font-weight: 700;
        margin: 0;
    }

    .login-title p {
        font-size: 1rem;
        color: #666;
        margin-top: .3rem;
    }

    .form-group {
        margin-bottom: 1.4rem;
    }

    label {
        font-weight: 600;
        margin-bottom: .4rem;
        display: block;
        color: #333;
    }

    .form-control {
        width: 100%;
        padding: .9rem;
        border-radius: 10px;
        border: 1.8px solid #d8d8d8;
        font-size: 1rem;
        transition: all .3s ease;
        background: #fafafa;
    }

    .form-control:focus {
        border-color: #4caf50;
        background: white;
        box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        outline: none;
    }

    .btn-submit {
        width: 100%;
        padding: 1rem;
        background: #2e7d32;
        background: linear-gradient(135deg, #2e7d32, #4caf50);
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform .3s ease, box-shadow .3s ease;
        margin-top: 0.5rem;
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0px 5px 15px rgba(46, 125, 50, 0.4);
    }

    .register-link {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.95rem;
    }

    .register-link a {
        font-weight: 600;
        color: #2e7d32;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    /* Animación */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">

    <div class="login-card">
        <div class="login-title">
            <h2>🌿 Iniciar Sesión</h2>
            <p>Accede a tu cuenta de AgroExport</p>
        </div>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Usuario</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Ingresa tu usuario"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Ingresa tu contraseña"
                    required>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>

        <div class="register-link">
            <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a></p>
        </div>
    </div>

</div>
{% endblock %}
